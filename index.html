<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#000000">
<meta name="background-color" content="#000000">
<meta name="description" content="QUOKKA餐車">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">

<!-- iPhone / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="QUOKKA餐車">

<!-- App 圖示 -->
<link
    rel="apple-touch-icon"
    href="https://raw.githubusercontent.com/paulie0102-Bear/farm/refs/heads/main/quokka.png"
>

<title>QUOKKA餐車</title>

<style>
/* =========================================================
   基礎
========================================================= */

:root{
    --green:#5f8f55;
    --green-dark:#3f6840;
    --green-light:#edf7e9;
    --cream:#fffaf0;
    --cream-dark:#f4ead4;
    --brown:#765b45;
    --brown-dark:#503b2c;
    --orange:#e9a34a;
    --orange-dark:#c87922;
    --pink:#e98c9d;
    --pink-light:#ffe8ed;
    --blue:#79a9c7;
    --blue-light:#e6f3fa;
    --gold:#e0b84f;
    --text:#4a4039;
    --shadow:0 5px 18px rgba(74,64,57,.12);
    --radius:18px;
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    color:var(--text);
    background:#dcebd8;
    overscroll-behavior:none;
}

button{
    font-family:inherit;
}

button,
.card,
.region-card,
.recipe-card,
.line-card,
.skin-card,
.character-card{
    user-select:none;
}

#app{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100dvh;
    overflow:hidden;
}


/* =========================================================
   頁面
========================================================= */

.page{
    position:absolute;
    inset:0;
    display:none;
    overflow-y:auto;
    overflow-x:hidden;
    padding:
        calc(12px + var(--safe-top))
        12px
        calc(105px + var(--safe-bottom))
        12px;
    -webkit-overflow-scrolling:touch;
    background:
        linear-gradient(
            180deg,
            #eaf5e5 0%,
            #d9ecd2 45%,
            #cfe5c8 100%
        );
}

.page.active{
    display:block;
    animation:pageIn .25s ease-out;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   頂部
========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:58px;
    margin-bottom:12px;
    padding:10px 13px;
    border-radius:18px;
    background:rgba(255,250,240,.92);
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
}

.title-area{
    min-width:0;
}

.title{
    margin:0;
    font-size:20px;
    font-weight:900;
    color:var(--green-dark);
}

.subtitle{
    margin-top:2px;
    font-size:11px;
    color:#927f6d;
}

.currency{
    display:flex;
    align-items:center;
    gap:5px;
    padding:7px 10px;
    border-radius:20px;
    background:#fff3c9;
    color:#9a6a15;
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
}


/* =========================================================
   通用卡片
========================================================= */

.card{
    margin-bottom:12px;
    padding:15px;
    background:rgba(255,250,240,.94);
    border:1px solid rgba(118,91,69,.08);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:16px;
    font-weight:900;
    color:var(--green-dark);
}

.section-title small{
    font-size:11px;
    color:#a38d79;
    font-weight:600;
}


/* =========================================================
   按鈕
========================================================= */

.btn{
    width:100%;
    min-height:44px;
    border:0;
    border-radius:13px;
    padding:10px 13px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    transition:
        transform .1s,
        filter .1s;
}

.btn:active{
    transform:scale(.97);
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.btn-green{
    color:#fff;
    background:var(--green);
    box-shadow:0 3px 0 #466d40;
}

.btn-orange{
    color:#fff;
    background:var(--orange);
    box-shadow:0 3px 0 var(--orange-dark);
}

.btn-pink{
    color:#fff;
    background:var(--pink);
    box-shadow:0 3px 0 #c66e7d;
}

.btn-brown{
    color:#fff;
    background:var(--brown);
    box-shadow:0 3px 0 var(--brown-dark);
}

.btn-light{
    color:var(--brown);
    background:#fff;
    border:1px solid #eadfce;
}


/* =========================================================
   底部導覽
========================================================= */

.bottom-nav{
    position:fixed;
    left:10px;
    right:10px;
    bottom:calc(8px + var(--safe-bottom));
    z-index:100;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:7px;
    border-radius:20px;
    background:rgba(75,64,53,.94);
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
}

.nav-btn{
    min-height:58px;
    border:0;
    border-radius:14px;
    color:#dfd7cb;
    background:transparent;
    font-size:11px;
    font-weight:800;
}

.nav-btn .nav-icon{
    display:block;
    margin-bottom:3px;
    font-size:22px;
}

.nav-btn.active{
    color:#fff;
    background:rgba(255,255,255,.16);
}


/* =========================================================
   秘密花園背景
========================================================= */

.garden-scene{
    position:relative;
    min-height:180px;
    margin-bottom:12px;
    overflow:hidden;
    border-radius:22px;
    background:
        linear-gradient(
            180deg,
            #cce9f0 0%,
            #e8f3d8 48%,
            #a7cc8d 49%,
            #7ead68 100%
        );
    box-shadow:var(--shadow);
}

.sun{
    position:absolute;
    top:20px;
    right:25px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ffe29a;
    box-shadow:0 0 30px rgba(255,226,154,.8);
}

.cloud{
    position:absolute;
    width:70px;
    height:22px;
    border-radius:20px;
    background:rgba(255,255,255,.7);
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:inherit;
}

.cloud::before{
    width:28px;
    height:28px;
    left:12px;
    bottom:5px;
}

.cloud::after{
    width:35px;
    height:35px;
    right:10px;
    bottom:3px;
}

.cloud.c1{
    top:35px;
    left:25px;
}

.cloud.c2{
    top:70px;
    left:170px;
    transform:scale(.7);
}

.flower{
    position:absolute;
    bottom:12px;
    font-size:25px;
}

.f1{left:15px;}
.f2{left:70px;}
.f3{right:80px;}
.f4{right:20px;}

.garden-character-wrap{
    position:absolute;
    left:50%;
    bottom:5px;
    transform:translateX(-50%);
    width:120px;
    height:125px;
    cursor:pointer;
    z-index:5;
}

.garden-character{
    display:block;
    width:105px;
    height:105px;
    margin:0 auto;
    object-fit:contain;
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.15));
    pointer-events:none;
}

.garden-character-hint{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    padding:3px 8px;
    border-radius:10px;
    background:rgba(255,250,240,.9);
    color:#765b45;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}


/* =========================================================
   地區
========================================================= */

.region-list{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
    width:100%;
    max-width:100%;
}

.region-card{
    position:relative;
    min-width:0;
    width:100%;
    max-width:100%;
    min-height:150px;
    padding:13px;
    border-radius:16px;
    border:2px solid transparent;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    cursor:pointer;
    overflow:hidden;
}

.region-card.selected{
    border-color:var(--green);
    background:#f1faee;
}

.region-icon{
    font-size:28px;
}

.region-name{
    margin-top:5px;
    font-weight:900;
    font-size:14px;
}

.region-desc{
    margin-top:2px;
    font-size:10px;
    color:#9a8876;
}

.region-reward-title{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid #eee4d5;
    font-size:10px;
    font-weight:900;
    color:#765b45;
}

.region-reward-list{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:6px;
}

.region-reward-item{
    padding:4px 7px;
    border-radius:10px;
    background:#f5f1e9;
    color:#6f8f62;
    font-size:10px;
    font-weight:900;
}

.dispatch-team{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.dispatch-slot{
    min-height:100px;
    padding:8px;
    border:2px dashed #d8cdbd;
    border-radius:15px;
    background:#fffaf2;
    text-align:center;
    cursor:pointer;
}

.dispatch-slot.filled{
    border-style:solid;
    border-color:var(--green);
    background:#f1faee;
}

.dispatch-slot-icon{
    font-size:34px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.dispatch-slot-name{
    font-size:10px;
    font-weight:900;
    color:#765b45;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.dispatch-slot-plus{
    font-size:36px;
    line-height:52px;
    color:#b8aa98;
}

.dispatch-team-title{
    margin-top:10px;
    font-size:12px;
    font-weight:900;
    color:#765b45;
}


/* =========================================================
   派遣
========================================================= */

.dispatch-region{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:14px;
    background:#edf7e9;
}

.dispatch-region-icon{
    font-size:35px;
}

.dispatch-region-name{
    font-size:15px;
    font-weight:900;
}

.dispatch-region-desc{
    margin-top:2px;
    color:#927f6d;
    font-size:11px;
}

.food-choice{
    display:grid;
    gap:8px;
    margin-top:8px;
}

.food-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px;
    border-radius:13px;
    border:2px solid #eee4d5;
    background:#fff;
    cursor:pointer;
}

.food-option.selected{
    border-color:var(--orange);
    background:#fff7e8;
}

.food-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.food-icon{
    font-size:24px;
}

.food-name{
    font-size:13px;
    font-weight:900;
}

.food-count{
    font-size:11px;
    color:#998876;
}


/* =========================================================
   派遣進行
========================================================= */

.expedition-active{
    text-align:center;
}

.expedition-character{
    display:block;
    width:135px;
    height:135px;
    margin:5px auto 0;
    object-fit:contain;
    filter:drop-shadow(0 7px 5px rgba(0,0,0,.13));
}

.progress-track{
    height:10px;
    margin:12px 0;
    overflow:hidden;
    border-radius:20px;
    background:#e8dfd3;
}

.progress-fill{
    height:100%;
    background:
        linear-gradient(
            90deg,
            #79a969,
            #b9d67a
        );
    transition:width .5s linear;
}


/* =========================================================
   好感角色
========================================================= */

.character-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.character-card{
    padding:10px;
    border-radius:16px;
    background:#fff;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.character-img{
    width:80px;
    height:80px;
    object-fit:contain;
}

.character-name{
    margin-top:3px;
    font-size:12px;
    font-weight:900;
}

.hearts{
    margin-top:4px;
    font-size:14px;
    letter-spacing:1px;
}

.joined{
    color:var(--green);
    font-size:11px;
    font-weight:900;
}


/* =========================================================
   食材
========================================================= */

.ingredient-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.ingredient{
    padding:11px 5px;
    border-radius:14px;
    background:#fff;
    text-align:center;
}

.ingredient-icon{
    font-size:25px;
}

.ingredient-name{
    margin-top:3px;
    font-size:10px;
    color:#917e6c;
}

.ingredient-count{
    margin-top:2px;
    font-size:16px;
    font-weight:900;
}


/* =========================================================
   料理線
========================================================= */

.cooking-lines{
    display:grid;
    gap:10px;
}

.line-card{
    padding:13px;
    border-radius:16px;
    background:#fff;
    border:1px solid #eee2d4;
}

.line-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}

.line-name{
    font-weight:900;
    font-size:14px;
}

.line-status{
    font-size:10px;
    color:#a18d79;
}

.recipe-select{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.recipe-mini{
    padding:7px 2px;
    border-radius:10px;
    border:1px solid #eadfce;
    background:#fffaf2;
    text-align:center;
    cursor:pointer;
}

.recipe-mini.selected{
    border:2px solid var(--orange);
    background:#fff3dc;
}

.recipe-mini-icon{
    font-size:21px;
}

.recipe-mini-name{
    margin-top:2px;
    font-size:9px;
    line-height:1.2;
}

.recipe-result{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:9px;
    padding:9px;
    border-radius:11px;
    background:#f7f4ee;
}

.recipe-result-icon{
    font-size:30px;
}

.recipe-result-name{
    font-weight:900;
    font-size:12px;
}

.cook-progress{
    margin-top:8px;
}

.cook-time{
    text-align:right;
    font-size:10px;
    color:#9a8775;
}

.lock-line{
    text-align:center;
    padding:20px 10px;
    color:#a28e7a;
}


/* =========================================================
   小幫手料理
========================================================= */

.helper-box{
    padding:12px;
    border-radius:16px;
    background:linear-gradient(135deg,#fff9dc,#fff3c5);
    border:1px solid #f2d46b;
    text-align:center;
}

.helper-title{
    font-size:13px;
    font-weight:900;
    color:#795548;
}

.helper-desc{
    margin-top:3px;
    font-size:10px;
    color:#9a806d;
}

.helper-center{
    text-align:center;
}

.helper-character{
    width:86px;
    height:86px;
    margin:4px auto 6px;
    overflow:hidden;
    border-radius:18px;
    background:#fff8d6;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.helper-character img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.helper-name{
    font-size:14px;
    font-weight:900;
    color:#795548;
}

.helper-count{
    margin-top:3px;
    font-size:10px;
    color:#9a806d;
}

.helper-recipes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:12px;
}

.helper-recipe{
    padding:9px 3px;
    border-radius:12px;
    background:#fff;
    border:2px solid #eadfce;
    text-align:center;
    cursor:pointer;
    transition:.1s;
}

.helper-recipe:hover{
    border-color:#e0b84f;
}

.helper-recipe.have{
    border-color:#e0b84f;
    background:#fff9df;
}

.helper-recipe.done{
    opacity:.45;
    filter:grayscale(1);
    cursor:not-allowed;
}

.helper-recipe-icon{
    font-size:24px;
}

.helper-recipe-name{
    margin-top:3px;
    font-size:9px;
    font-weight:900;
}

.helper-recipe-count{
    margin-top:2px;
    font-size:9px;
    color:#998675;
}

.helper-note{
    margin-top:9px;
    font-size:10px;
    text-align:center;
    color:#9a806d;
}

.helper-job{
    margin-top:12px;
    padding:10px;
    border-radius:13px;
    background:#fff;
    border:1px solid #eadfce;
}

.helper-job-title{
    font-size:11px;
    font-weight:900;
    color:#795548;
}

.helper-job-time{
    margin-top:3px;
    font-size:10px;
    color:#998675;
}

.helper-job-progress{
    margin-top:7px;
}

.dish-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.dish-stock{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px;
    border-radius:13px;
    background:#fff;
    border:1px solid #eee2d4;
}

.dish-stock-icon{
    font-size:27px;
}

.dish-stock-name{
    font-size:11px;
    font-weight:900;
}

.dish-stock-count{
    margin-top:2px;
    font-size:10px;
    color:#998675;
}


/* =========================================================
   餐車
========================================================= */

.truck-page-wrap{
    position:relative;
    width:100%;
    margin-bottom:12px;
}

.truck-stage{
    position:relative;
    width:100%;
    height:560px;
    overflow:hidden;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.truck-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:60;
    width:42px;
    height:70px;
    border:0;
    border-radius:15px;
    background:rgba(255,255,255,.9);
    color:#765b45;
    font-size:42px;
    font-weight:900;
    line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    cursor:pointer;
}

.truck-nav-left{
    left:7px;
}

.truck-nav-right{
    right:7px;
}

.truck-nav:active{
    transform:translateY(-50%) scale(.94);
}

.truck-counter-title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 14px;
    border-radius:18px;
    background:rgba(255,255,255,.92);
    font-size:11px;
    font-weight:900;
    color:#765b45;
    z-index:50;
    white-space:nowrap;
}

.truck-environment{
    position:absolute;
    left:15px;
    right:15px;
    bottom:7px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:38px;
    opacity:.85;
    pointer-events:none;
    z-index:5;
}

/* =========================================================
   餐車店員
========================================================= */

.truck-staff{
    position:absolute;
    left:27%;
    bottom:145px;
    transform:translateX(-50%);
    width:105px;
    height:105px;
    z-index:24;
    pointer-events:none;
}

.truck-staff img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.18));
}

/* =========================================================
   餐車場景
========================================================= */

.truck-scene{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
    background:#dff3d5;
    transition:background .4s ease;
}

.truck-scene::before,
.truck-scene::after{
    pointer-events:none;
}

.truck-scene::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:38%;
    background:#9bcf78;
    z-index:0;
    transition:all .4s ease;

}

.sign-sparkle::after{

.sign-candy::after{

.sign-moon::after{

    right:-18px;
    top:-14px;

/* =========================================================
   招牌動畫
========================================================= */

@keyframes signBlink{
    from{
        filter:brightness(1);
    }
    to{
        filter:brightness(1.6);
    }
}

@keyframes rainbowMove{
    from{
        background-position:0% 50%;
    }
    to{
        background-position:200% 50%;
    }
}

@keyframes sparkleGlow{
    from{
        filter:brightness(1);
        transform:scale(1);
    }
    to{
        filter:brightness(1.25);
        transform:scale(1.03);
    }
}

@keyframes magicMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

/* =========================================================
   售出提示
========================================================= */

.sold-message{
    position:absolute;
    left:50%;
    top:65px;
    transform:translateX(-50%);
    padding:8px 14px;
    border-radius:20px;
    background:rgba(255,255,255,.95);
    color:#c27a21;
    font-size:12px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    z-index:40;
}

.sold-message.show{
    animation:soldUp 1.5s ease-out;
}

@keyframes soldUp{
    0%{
        opacity:0;
        transform:translate(-50%,10px);
    }
    20%{
        opacity:1;
        transform:translate(-50%,0);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-25px);
    }
}

/* =========================================================
   IndexedDB 存檔系統
========================================================= */

const SAVE_DB_NAME = "SecretGardenDB";
const SAVE_DB_VERSION = 1;
const SAVE_STORE_NAME = "saveData";
const SAVE_KEY = "main";

let state = cloneDefaultState();
let saveReady = false;
let saveQueue = Promise.resolve();


function cloneDefaultState(){

    return structuredClone
        ? structuredClone(DEFAULT_STATE)
        : JSON.parse(
            JSON.stringify(DEFAULT_STATE)
        );

}


/* =========================================================
   開啟 IndexedDB
========================================================= */

function openSaveDB(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    SAVE_DB_NAME,
                    SAVE_DB_VERSION
                );


            request.onupgradeneeded =
                event=>{

                    const db =
                        event.target.result;


                    if(
                        !db.objectStoreNames.contains(
                            SAVE_STORE_NAME
                        )
                    ){

                        db.createObjectStore(
                            SAVE_STORE_NAME
                        );

                    }

                };


            request.onsuccess =
                ()=>{

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                ()=>{

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   IndexedDB 讀取
========================================================= */

function readIndexedDB(){

    return openSaveDB()
        .then(
            db=>{

                return new Promise(
                    (resolve,reject)=>{

                        const transaction =
                            db.transaction(
                                SAVE_STORE_NAME,
                                "readonly"
                            );

                        const store =
                            transaction.objectStore(
                                SAVE_STORE_NAME
                            );

                        const request =
                            store.get(
                                SAVE_KEY
                            );


                        request.onsuccess =
                            ()=>{

                                resolve(
                                    request.result || null
                                );

                            };


                        request.onerror =
                            ()=>{

                                reject(
                                    request.error
                                );

                            };

                    }
                );

            }
        );

}


/* =========================================================
   IndexedDB 寫入
========================================================= */

function writeIndexedDB(data){

    return openSaveDB()
        .then(
            db=>{

                return new Promise(
                    (resolve,reject)=>{

                        const transaction =
                            db.transaction(
                                SAVE_STORE_NAME,
                                "readwrite"
                            );

                        const store =
                            transaction.objectStore(
                                SAVE_STORE_NAME
                            );


                        store.put(
                            data,
                            SAVE_KEY
                        );


                        transaction.oncomplete =
                            ()=>{

                                resolve();

                            };


                        transaction.onerror =
                            ()=>{

                                reject(
                                    transaction.error
                                );

                            };

                    }
                );

            }
        );

}


/* =========================================================
   讀取存檔
   IndexedDB → 舊 localStorage
========================================================= */

async function loadState(){

    try{

        const indexedData =
            await readIndexedDB();


        if(indexedData){

            return mergeState(
                indexedData
            );

        }


        /*
           第一次改成 IndexedDB 時，
           嘗試讀取舊 localStorage。
        */

        const oldRaw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(oldRaw){

            try{

                const oldData =
                    JSON.parse(
                        oldRaw
                    );


                const merged =
                    mergeState(
                        oldData
                    );


                /*
                   搬到 IndexedDB。
                */

                await writeIndexedDB(
                    merged
                );


                /*
                   搬完之後刪除舊存檔。
                */

                localStorage.removeItem(
                    STORAGE_KEY
                );


                console.log(
                    "舊存檔已轉移至 IndexedDB"
                );


                return merged;

            }catch(error){

                console.error(
                    "舊 localStorage 存檔讀取失敗",
                    error
                );

            }

        }


        return cloneDefaultState();

    }catch(error){

        console.error(
            "IndexedDB 讀檔失敗",
            error
        );


        /*
           如果瀏覽器不支援 IndexedDB，
           暫時使用預設資料，避免整個遊戲無法啟動。
        */

        return cloneDefaultState();

    }

}


/* =========================================================
   合併存檔
========================================================= */
function mergeState(saved){
const base=cloneDefaultState();
const merged=Object.assign(base,saved||{});
merged.dishes=Object.assign({},saved?.dishes||{});
merged.helper=Object.assign({date:"",requests:[],served:{},jobs:{}},saved?.helper||{});
merged.helper.requests=Array.isArray(merged.helper.requests)?merged.helper.requests:[];
merged.helper.served=merged.helper.served||{};
merged.helper.jobs=merged.helper.jobs||{};
merged.ingredients=Object.assign({},DEFAULT_STATE.ingredients,saved?.ingredients||{});
merged.friendship=Object.assign({},saved?.friendship||{});
merged.expedition=Object.assign({},DEFAULT_STATE.expedition,saved?.expedition||{});
merged.trucks=Array.isArray(saved?.trucks)?saved.trucks:[];
if(!merged.trucks.length&&saved?.truck){
const old=saved.truck;
merged.trucks=[{
...createDefaultTruck(0),
...old,
id:0,
unlocked:true,
stock:Array.isArray(old.stock)?old.stock:[],
ownedSkins:Array.isArray(old.ownedSkins)&&old.ownedSkins.length?old.ownedSkins:["spring"],
ownedEnvironments:["grass"],
ownedSigns:["plain"]
}];
}
while(merged.trucks.length<TRUCK_MAX)merged.trucks.push(createDefaultTruck(merged.trucks.length));
merged.trucks.length=TRUCK_MAX;
merged.trucks.forEach((t,i)=>{
Object.assign(t,{id:i,unlockCost:TRUCK_UNLOCK_COST[i]||1000});
if(!Array.isArray(t.stock))t.stock=[];
if(!Array.isArray(t.ownedSkins)||!t.ownedSkins.length)t.ownedSkins=["spring"];
if(!t.ownedSkins.includes("spring"))t.ownedSkins.unshift("spring");
if(!Array.isArray(t.ownedEnvironments)||!t.ownedEnvironments.length)t.ownedEnvironments=["grass"];
if(!t.ownedEnvironments.includes("grass"))t.ownedEnvironments.unshift("grass");
if(!Array.isArray(t.ownedSigns)||!t.ownedSigns.length)t.ownedSigns=["plain"];
if(!t.ownedSigns.includes("plain"))t.ownedSigns.unshift("plain");
if(!t.skin)t.skin="spring";
if(!t.environment)t.environment="grass";
if(!t.sign)t.sign="plain";
if(!t.lastSaleTime)t.lastSaleTime=Date.now();
if(!Number.isFinite(Number(t.totalSales)))t.totalSales=0;
});
merged.cooking=Array.isArray(saved?.cooking)?saved.cooking:[];
while(merged.cooking.length<merged.cookingLines)merged.cooking.push({recipeId:null,endTime:0,helperEnabled:false});
if(!Array.isArray(merged.joined))merged.joined=[];
return merged;
}


/* =========================================================
   儲存
========================================================= */

function save(){

    /*
       讓大量連續 save() 不會同時寫入 IndexedDB。
    */

    const data =
        structuredClone
            ? structuredClone(state)
            : JSON.parse(
                JSON.stringify(state)
            );


    saveQueue =
        saveQueue
            .then(
                ()=>writeIndexedDB(
                    data
                )
            )
            .catch(
                error=>{

                    console.error(
                        "存檔失敗",
                        error
                    );

                }
            );


    return saveQueue;

}

/* =========================================================
   開始派遣
========================================================= */

function startDispatch(){
    if(state.expedition.active)return;
    if(!state.expedition.region){
        toast("請選擇一個地區");
        return;
    }
    const members=state.expedition.members?.filter(Boolean)||[];
    if(!members.length){
        toast("請至少選擇一位派遣隊員");
        return;
    }
    const dish=state.expedition.selectedDish;
    if(dish){
        const count=Number(state.dishes[dish]||0);
        if(count<=0){
            toast("料理數量不足");
            state.expedition.selectedDish=null;
            renderGarden();
            return;
        }
        state.dishes[dish]=count-1;
    }
    const now=Date.now();
    state.expedition.active=true;
    state.expedition.startTime=now;
    state.expedition.endTime=now+DISPATCH_TIME;
    state.expedition.targetCharacter=members[0];
    save();
    renderGarden();
    toast(`🧭 ${members.length} 位隊員出發了！`);
}


/* =========================================================
   派遣畫面
========================================================= */

let expeditionCountdownTimer=null;

function renderExpedition(){

    const setup=document.getElementById("dispatchSetup");
    const active=document.getElementById("activeExpedition");

    if(!setup||!active)return;

    /* 沒有派遣 */
    if(!state.expedition.active){

        setup.style.display="block";
        active.style.display="none";

        const status=document.getElementById("dispatchStatus");
        if(status)status.textContent="尚未派遣";

        if(expeditionCountdownTimer){
            clearInterval(expeditionCountdownTimer);
            expeditionCountdownTimer=null;
        }

        return;
    }

    setup.style.display="none";
    active.style.display="block";

    /* 清除舊計時器，避免重複倒數 */
    if(expeditionCountdownTimer){
        clearInterval(expeditionCountdownTimer);
        expeditionCountdownTimer=null;
    }

    /*
       建立派遣畫面
       只有這裡處理角色 GIF
    */

        let content=active.querySelector(".expedition-active");

    if(!content){
        content=document.createElement("div");
        content.className="expedition-active";
        content.innerHTML=`
            <div class="expedition-region"></div>
            <img class="expedition-character">
            <div class="expedition-character-name"></div>
            <div class="expedition-food"></div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
            <div class="expedition-countdown"></div>
        `;
        active.innerHTML="";
        active.appendChild(content);
    }

    /* 上一次派遣完成後會留下領取按鈕
       新派遣開始時恢復成倒數區域 */
    const oldCountdown=content.querySelector(".expedition-countdown");
    if(oldCountdown?.tagName==="BUTTON"){
        const newCountdown=document.createElement("div");
        newCountdown.className="expedition-countdown";
        oldCountdown.replaceWith(newCountdown);
    }
    /* =========================
       固定資料，只設定一次
    ========================= */

    const character=
        getCharacter(
            state.expedition.targetCharacter
        );

    const region=
        REGIONS.find(
            r=>r.id===state.expedition.region
        );

    const regionEl=
        content.querySelector(
            ".expedition-region"
        );

    const img=
        content.querySelector(
            ".expedition-character"
        );

    const nameEl=
        content.querySelector(
            ".expedition-character-name"
        );

    const foodEl=
        content.querySelector(
            ".expedition-food"
        );

    const progressFill=
        content.querySelector(
            ".progress-fill"
        );

    const countdown=
        content.querySelector(
            ".expedition-countdown"
        );

    /* 地區 */
    if(regionEl){
        regionEl.textContent=
            `${region?.icon||"🧭"} 正在前往 ${region?.name||""}`;
    }

    /* =========================
       GIF
       只設定一次
    ========================= */

    if(img){

        const src=
            characterImage(character);

        if(
            !img.getAttribute("src") ||
            img.getAttribute("src")!==src
        ){
            img.src=src;
        }

        img.alt=
            character?.name||"";
    }

    /* 名字 */
    if(nameEl){
        nameEl.textContent=
            character?.name||"";
    }

    /* 料理 */
    if(foodEl){
        foodEl.textContent=
            state.expedition.selectedDish
                ?"🍱 有帶料理"
                :"🚫 沒有帶料理";
    }

    /* =========================
       倒數更新
       這裡只碰文字和進度條
    ========================= */

    function updateExpeditionTime(){

        if(!state.expedition.active){

            if(expeditionCountdownTimer){
                clearInterval(
                    expeditionCountdownTimer
                );

                expeditionCountdownTimer=null;
            }

            return;
        }

        const now=Date.now();

        const remaining=
            Math.max(
                0,
                state.expedition.endTime-now
            );

        /* =========================
           進度條
        ========================= */

        const progress=
            Math.min(
                100,
                Math.max(
                    0,
                    (
                        (
                            now-
                            state.expedition.startTime
                        )
                        /DISPATCH_TIME
                    )*100
                )
            );

        if(progressFill){
            progressFill.style.width=
                `${progress}%`;
        }

        /* =========================
           完成
        ========================= */

        if(remaining<=0){

            /*
               直接把倒數區域變成領取按鈕
            */

            const old=
                content.querySelector(
                    ".expedition-countdown"
                );

            if(old){

                const button=
                    document.createElement("button");

                button.className=
                    "btn btn-orange expedition-countdown";

                button.textContent=
                    "🎁 派遣完成，領取成果";

                button.onclick=
                    completeDispatch;

                old.replaceWith(button);
            }

            const status=
                document.getElementById(
                    "dispatchStatus"
                );

            if(status){
                status.textContent=
                    "可以領取";
            }

            /* 停止計時器 */
            if(expeditionCountdownTimer){

                clearInterval(
                    expeditionCountdownTimer
                );

                expeditionCountdownTimer=null;
            }

            return;
        }

        /* =========================
           正常倒數
        ========================= */

        const timeText=
            formatTimeHMS(remaining);

        const countdownEl=
            content.querySelector(
                ".expedition-countdown"
            );

        /*
           只修改文字
           不重新建立 GIF
        */

        if(
            countdownEl &&
            countdownEl.tagName!=="BUTTON"
        ){
            countdownEl.textContent=
                `⏳ ${timeText}`;
        }

        const status=
            document.getElementById(
                "dispatchStatus"
            );

        if(status){
            status.textContent=
                "派遣中";
        }
    }

    /* 立即更新一次 */
    updateExpeditionTime();

    /* 每秒更新一次 */
    expeditionCountdownTimer=
        setInterval(
            updateExpeditionTime,
            1000
        );
}


/* =========================================================
   派遣完成
========================================================= */

function completeDispatch(){

    if(!state.expedition.active){
        return;
    }

    if(Date.now()<state.expedition.endTime){

        toast("派遣還沒完成");

        return;
    }


    const region=
        REGIONS.find(
            r=>
                r.id===
                state.expedition.region
        );


    if(!region){

        resetExpedition();

        return;
    }


    const members=
        state.expedition.members
            ?.filter(Boolean)
        ||[];


    /* =========================
       派遣食材獎勵
       保留原本規則：
       每位隊員每種食材 +3
    ========================= */

    const amount=
        Math.max(
            1,
            members.length
        )*3;


    const reward=[];


    (region.ingredients||[])
        .forEach(id=>{

            state.ingredients[id]=
                (
                    Number(
                        state.ingredients[id]
                    )
                    ||
                    0
                )
                +
                amount;


            const item=
                INGREDIENTS[id];


            reward.push({

                icon:
                    item?.icon||id,

                name:
                    item?.name||id,

                count:
                    amount

            });

        });


    let bonus=null;


    /* =====================================================
       只有帶料理才會遇到角色

       不帶料理：
       完全不進入這一段
       不會遇到任何角色

       帶料理：
       100% 遇到料理對應角色
    ===================================================== */

    if(
        state.expedition.selectedDish &&
        members.length
    ){

        const targetNames=
            getDispatchDishTargets(
                state.expedition.selectedDish
            );


        if(targetNames.length){

            /*
               如果一道料理有多個角色，
               先公平隨機決定是哪一個角色。
            */

            const targetName=
                targetNames[
                    Math.floor(
                        Math.random()*
                        targetNames.length
                    )
                ];


            /*
               再從這個角色的所有裝扮中
               隨機選一個外觀。
            */

            const character=
                getRandomCharacterOutfit(
                    targetName
                );


            if(character){

                /*
                   找角色本體。

                   例如抽到 QUOKKA7，
                   好感仍算在 QUOKKA。

                   抽到 BOBO2，
                   好感仍算在 BOBO。
                */

                const baseCharacter=
                    getBaseCharacter(
                        character
                    );


                const friendshipId=
                    baseCharacter.id;


                if(
                    !state.friendship ||
                    typeof state.friendship!=="object"
                ){
                    state.friendship={};
                }


                const current=
                    Number(
                        state.friendship[
                            friendshipId
                        ]||0
                    );


                /* =========================
                   尚未滿 3 心
                ========================= */

                if(current<3){

                    const newFriendship=
                        Math.min(
                            3,
                            current+1
                        );


                    state.friendship[
                        friendshipId
                    ]=
                        newFriendship;


                    if(
                        !Array.isArray(
                            state.joined
                        )
                    ){
                        state.joined=[];
                    }


                    /* =========================
                       達到三顆心
                       角色本體加入小隊
                    ========================= */

                    if(
                        newFriendship>=3 &&
                        !state.joined.includes(
                            friendshipId
                        )
                    ){

                        state.joined.push(
                            friendshipId
                        );


                        bonus={

                            type:"joined",

                            /*
                               結果畫面仍顯示
                               這次隨機遇到的裝扮
                            */
                            character,

                            text:
                                "好感度達到 ❤️❤️❤️，已加入小隊！"

                        };

                    }else{

                        bonus={

                            type:"friendship",

                            character,

                            text:
                                `好感度 +1（${newFriendship}/3）`

                        };

                    }


                }else{

                    /* =========================
                       已滿 3 心
                       保留你原本的送禮機制
                    ========================= */

                    const ids=
                        Object.keys(
                            INGREDIENTS
                        );


                    if(ids.length){

                        const id=
                            ids[
                                Math.floor(
                                    Math.random()*
                                    ids.length
                                )
                            ];


                        state.ingredients[id]=
                            (
                                Number(
                                    state.ingredients[id]
                                )
                                ||
                                0
                            )
                            +
                            1;


                        const item=
                            INGREDIENTS[id];


                        bonus={

                            type:"gift",

                            character,

                            item,

                            count:1

                        };

                    }

                }

            }

        }

    }


    /*
       注意：
       沒有 selectedDish 時，
       bonus 永遠保持 null。

       所以不帶料理
       絕對不會遇到角色。
    */


    save();

    resetExpedition();

    renderGarden();

    renderKitchen();

    showDispatchResult(
        region,
        reward,
        bonus
    );
}

function formatTimeHMS(ms){
    const sec=Math.max(0,Math.ceil(ms/1000));
    const h=Math.floor(sec/3600);
    const m=Math.floor((sec%3600)/60);
    const s=sec%60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* =========================================================

========================================================= */

function renderCookingLines(){
const container=document.getElementById("cookingLines");
if(!container)return;
const count=document.getElementById("lineCount");
if(count)count.textContent=state.cookingLines;
for(let i=0;i<state.cookingLines;i++){
if(!state.cooking[i])state.cooking[i]={recipeId:null,endTime:0,helperEnabled:false};
let card=container.children[i];
const line=state.cooking[i];
const recipe=RECIPES.find(r=>r.id===line.recipeId);
if(!card){
card=document.createElement("div");
card.className="line-card";
container.appendChild(card);
}
if(!card.dataset.lineReady){
card.innerHTML=`<div class="line-header"><div class="line-name">🍳 料理線 ${i+1}</div><div class="line-status"></div></div><div class="line-content"></div>`;
card.dataset.lineReady="1";
}
const status=card.querySelector(".line-status");
const content=card.querySelector(".line-content");
const now=Date.now();
const busy=line.recipeId&&line.endTime>now;
const done=line.recipeId&&line.endTime>0&&line.endTime<=now;
if(status)status.textContent=busy?"製作中":done?"完成":"待機中";
if(!line.recipeId){
if(card.dataset.recipeId!==""){
content.innerHTML=renderRecipeSelector(i,line);
card.dataset.recipeId="";
}
continue;
}
const recipeId=String(line.recipeId);
if(card.dataset.recipeId!==recipeId||card.dataset.done!==String(done)){
content.innerHTML=renderCookingProgress(line,recipe);
card.dataset.recipeId=recipeId;
card.dataset.done=String(done);
}else{
    const remaining=Math.max(0,line.endTime-now);
    const progress=Math.min(100,Math.max(0,((COOK_TIME-remaining)/COOK_TIME)*100));
    const timeEl=content.querySelector(".cook-time");
    const fill=content.querySelector(".progress-fill");
    if(timeEl&&remaining>0)timeEl.textContent=`⏳ ${formatTimeHMS(remaining)}`;
    if(fill&&remaining>0)fill.style.width=`${progress}%`;
}
}
while(container.children.length>state.cookingLines)container.removeChild(container.lastChild);
}

/* =========================================================
   檢查材料
========================================================= */

function canCook(recipe){

    return recipe.ingredients.every(
        ingredient=>
            Number(
                state.ingredients[ingredient] || 0
            ) >= 1
    );

}


/* =========================================================
   開始料理
========================================================= */

function startCooking(lineIndex,recipeId){
const line=state.cooking[lineIndex];
if(!line)return;
if(line.recipeId&&line.endTime>Date.now()){
toast("這條料理線正在製作中");
return;
}
const recipe=RECIPES.find(r=>r.id===recipeId);
if(!recipe||!canCook(recipe))return;
recipe.ingredients.forEach(id=>state.ingredients[id]--);
line.recipeId=recipe.id;
line.endTime=Date.now()+COOK_TIME;
line.helperEnabled=false;
closeModal();
save();
renderKitchen();
toast(`🍳 ${recipe.name} 開始料理`);
}

function getUpgradeCost(){

function upgradeCookingLine(){
    const cost=getUpgradeCost();

    if(!cost){
        toast("料理線已達最大數量");
        return;
    }

    if(state.coins<cost){
        toast("錢幣不足");
        return;
    }

    state.coins-=cost;
    state.cookingLines++;

    state.cooking.push({
        recipeId:null,
        endTime:0,
        helperEnabled:false
    });

    save();
    renderKitchen();

    toast("🍳 新料理線已解鎖！");
}

function getHelperMaxCycles(recipe){

let cycles=4;
for(const id of recipe.ingredients){

cycles=Math.min(cycles,Math.floor(amount));
}
return Math.max(0,cycles);
}

function startHelperCooking(recipeId,cycles){
    ensureHelperDaily();

    const recipe=RECIPES.find(r=>r.id===recipeId);
    const helperId=state.helper?.characterId;

    if(!recipe||!helperId)return;

    if(state.helper.served[recipeId]){
        toast("今天已經委託過這道料理");
        return;
    }

    if(!state.helper.requests.includes(recipeId)){
        toast("不是今日指定料理");
        return;
    }

    const active=getActiveHelperJob();

    if(active){
        toast("小幫手目前正在工作");
        return;
    }

    cycles=Math.min(4,Math.max(1,Math.floor(Number(cycles)||1)));

    const maxCycles=getHelperMaxCycles(recipe);

    if(maxCycles<cycles){
        toast("材料數量已不足，請重新確認");
        renderCookingHelper();
        return;
    }

    if(Number(state.dishes?.[recipeId]||0)<1){
        toast(`需要先擁有 ${recipe.name} ×1`);
        return;
    }

    for(const id of recipe.ingredients){
        state.ingredients[id]=
            Number(state.ingredients?.[id]||0)-cycles;
    }

    state.dishes[recipeId]=
        Number(state.dishes[recipeId]||0)-1;

    const now=Date.now();

    // 每次建立工作時重新計算，不累加之前的時間
    const duration=cycles*60*60*1000;

    const jobId=
        "helper_"+now+"_"+Math.random().toString(36).slice(2,7);

    state.helper.jobs[jobId]={
        helperId:helperId,
        recipeId:recipeId,
        cycles:cycles,
        startTime:now,
        endTime:now+duration,
        completed:false
    };

    state.helper.served[recipeId]=true;

    save();
    closeModal();
    renderKitchen();

    toast(
        `🌟 ${recipe.name} 已委託 ${cycles} 份，開始倒數 ${cycles} 小時`
    );
}

function processHelperJobs(){
if(!state.helper?.jobs)return;
const now=Date.now();
let changed=false;
Object.keys(state.helper.jobs).forEach(key=>{
const job=state.helper.jobs[key];
if(!job||job.completed)return;
if(now>=Number(job.endTime)){
job.completed=true;
changed=true;
}
});
if(changed)save();
}

function formatHelperTime(ms){
const sec=Math.max(0,Math.ceil(ms/1000));
const h=Math.floor(sec/3600);
const m=Math.floor((sec%3600)/60);
const s=sec%60;
return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function claimHelperCooking(jobKey){
const job=state.helper?.jobs?.[jobKey];
if(!job){
toast("找不到小幫手工作");
return;
}
if(!job.completed&&Date.now()<Number(job.endTime)){
toast("小幫手還沒完成");
return;
}
const recipe=RECIPES.find(r=>r.id===job.recipeId);
if(!recipe){
delete state.helper.jobs[jobKey];
save();
renderKitchen();
return;
}
const cycles=Math.min(4,Math.max(1,Number(job.cycles)||1));
let total=0;
for(let i=0;i<cycles;i++){
if(finishCookingReward(recipe.id))total++;
}
delete state.helper.jobs[jobKey];
save();
renderKitchen();
toast(`🎁 已領取 ${total} 份${recipe.name}`);
}

function ensureTruckData(){
if(!Array.isArray(state.trucks))state.trucks=[];
if(!state.trucks.length&&state.truck){
const old=state.truck;
state.trucks=[{...createDefaultTruck(0),...old,unlocked:true,stock:Array.isArray(old.stock)?old.stock:[],ownedSkins:Array.isArray(old.ownedSkins)&&old.ownedSkins.length?old.ownedSkins:["spring"],ownedEnvironments:["grass"],ownedSigns:["plain"]}];
}
while(state.trucks.length<TRUCK_MAX)state.trucks.push(createDefaultTruck(state.trucks.length));

state.trucks.forEach((t,i)=>{

if(!Array.isArray(t.stock))t.stock=[];

if(!Array.isArray(t.ownedSigns)||!t.ownedSigns.length)t.ownedSigns=["plain"];
if(!t.ownedSigns.includes("plain"))t.ownedSigns.unshift("plain");
if(!t.skin)t.skin="spring";

if(!t.sign)t.sign="plain";
if(!("staffId" in t))t.staffId=null;
if(!t.lastSaleTime)t.lastSaleTime=Date.now();
if(!Number.isFinite(Number(t.totalSales)))t.totalSales=0;
});
}
function formatTruckTime(ms){
const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
return h>0?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`;
}
function calcTruckSellout(truck){
if(!truck?.stock?.length)return 0;
const now=Date.now();
let end=0;
for(const batch of truck.stock){
const qty=Math.max(0,Math.floor(Number(batch?.qty)||0));
if(!batch||qty<=0)continue;
const sold=Math.max(0,Math.floor(Number(batch.soldUnits)||0));
const listed=Number(batch.listedAt)||now;
const original=qty+sold;
const start=Math.max(listed,end);
end=start+original*SALE_TIME;
}
return Math.max(0,end-now);
}

return truck?.stock?.find(x=>x&&Number(x.qty)>0)?.recipeId||null;
}

function getTruckStaffOwner(characterId,excludeIndex=-1){
    ensureTruckData();

    for(let i=0;i<state.trucks.length;i++){
        if(i===excludeIndex)continue;

        const truck=state.trucks[i];

        if(
            truck?.unlocked &&
            truck.staffId &&
            String(truck.staffId)===String(characterId)
        ){
            return i;
        }
    }

    return -1;
}
function openTruckStaffModal(index){
ensureTruckData();
const truck=state.trucks[index];
if(!truck?.unlocked)return;
const modal=document.getElementById("modal");
if(!modal)return;
modal.innerHTML=`<div class="modal-title">🧑‍🍳 選擇餐車 ${index+1} 店員</div>${renderCharacterPicker(truck.staffId,"selectTruckStaff")}<div style="height:10px"></div>${truck.staffId?`<button class="btn btn-light" onclick="removeTruckStaff(${index})">取消店員</button><div style="height:7px"></div>`:""}<button class="btn btn-light" onclick="openTruckEditor(${index})">返回餐車編輯</button>`;
truckDraftIndex=index;
openModal();
}

function selectTruckStaff(id){
const index=truckDraftIndex;
const truck=state.trucks[index];
const character=getCharacter(id);
if(!truck||!character)return;

const friendship=Math.min(3,Number(state.friendship?.[id]||0));

if(friendship<3){
toast(`❤️ ${character.name} 的好感度尚未滿，無法選擇`);
return;
}

// 檢查店員是否已經在其他餐車
const owner=getTruckStaffOwner(id,index);

if(owner!==-1){
toast(`🚚 ${character.name} 已經在餐車 ${owner+1} 上班`);
return;
}

truck.staffId=id;

save();
renderTruck();
openTruckEditor(index);

toast(`🧑‍🍳 ${character.name} 已成為餐車 ${index+1} 的店員`);
}

function removeTruckStaff(index){
const truck=state.trucks[index];
if(!truck)return;
truck.staffId=null;
save();
renderTruck();
openTruckEditor(index);
toast("已取消餐車店員");
}

function renderTruckEditQueue(truck){
if(!truck.stock?.length)return`<div class="truck-empty">目前沒有待販售料理</div>`;
return truck.stock.filter(x=>Number(x?.qty)>0).map((b,i)=>{const r=RECIPES.find(x=>x.id===b.recipeId);return`<div class="truck-queue-row"><span>${i+1}</span><b>${r?.icon||"🍱"}</b><div><strong>${r?.name||"料理"}</strong><small>剩餘 ${b.qty} 份</small></div></div>`;}).join("");
}
function buyTruckSkin(index,id){
const t=state.trucks[index],s=TRUCK_SKINS.find(x=>x.id===id);
if(!t||!s)return;
if(!t.ownedSkins.includes(id)){if(state.coins<s.price){toast("錢幣不足");return;}state.coins-=s.price;t.ownedSkins.push(id);}
t.skin=id;save();openTruckEditor(index);renderTruck();
}
function buyTruckEnvironment(index,id){
const t=state.trucks[index],e=TRUCK_ENVIRONMENTS.find(x=>x.id===id);
if(!t||!e)return;
if(!t.ownedEnvironments.includes(id)){if(state.coins<e.price){toast("錢幣不足");return;}state.coins-=e.price;t.ownedEnvironments.push(id);}
t.environment=id;save();openTruckEditor(index);renderTruck();
}
function buyTruckSign(index,id){
const t=state.trucks[index],s=TRUCK_SIGNS.find(x=>x.id===id);
if(!t||!s)return;
if(!t.ownedSigns.includes(id)){if(state.coins<s.price){toast("錢幣不足");return;}state.coins-=s.price;t.ownedSigns.push(id);}
t.sign=id;save();openTruckEditor(index);renderTruck();
}
function confirmTruckEditor(){
const t=state.trucks[truckDraftIndex];
if(!t)return;
let added=0;
for(const r of RECIPES){
const input=document.getElementById(`refill_${r.id}`);
if(!input)continue;
let amount=Math.max(0,Math.floor(Number(input.value)||0));
amount=Math.min(amount,Number(state.dishes[r.id]||0));
if(amount<=0)continue;
state.dishes[r.id]=Number(state.dishes[r.id]||0)-amount;
t.stock.push({recipeId:r.id,qty:amount,listedAt:Date.now(),soldUnits:0});
added+=amount;
}
save();
closeModal();
renderTruck();
toast(added?`🚚 已加入 ${added} 份料理`:`🚚 餐車設定已更新`);
}
function processTruckSales(){
ensureTruckData();
const now=Date.now();
let changed=false;
for(const t of state.trucks){
if(!t.unlocked||!Array.isArray(t.stock))continue;
let previousEnd=0;
const newQueue=[];
for(const b of t.stock){
if(!b||Number(b.qty)<=0)continue;
const qty=Math.max(0,Math.floor(Number(b.qty)||0));
const sold=Math.max(0,Math.floor(Number(b.soldUnits)||0));
const original=qty+sold;
const listed=Number(b.listedAt)||now;
const start=Math.max(listed,previousEnd);
const theoretical=Math.floor(Math.max(0,now-start)/SALE_TIME);
const available=Math.max(0,theoretical-sold);
const sales=Math.min(available,qty);
if(sales>0){
b.qty-=sales;
b.soldUnits+=sales;
state.coins+=sales*SALE_PRICE;
t.totalSales+=sales;
changed=true;
const r=RECIPES.find(x=>x.id===b.recipeId);
if(r)showSoldMessage(r);
}
previousEnd=start+original*SALE_TIME;
if(b.qty>0)newQueue.push(b);
}
t.stock=newQueue;
if(!t.stock.length)t.lastSaleTime=now;
}
if(changed)save();
}
function showSoldMessage(recipe){
const el=document.getElementById("soldMessage");
if(!el)return;
el.textContent=`💰 ${recipe.name} ×1 +${SALE_PRICE}`;
el.classList.remove("show");
void el.offsetWidth;
el.classList.add("show");
}
function renderTruckCustomerLoop(){
if(!document.getElementById("customerArea"))return;
if(truckCustomerTimer)return;
truckCustomerTimer=setTimeout(spawnTruckCustomer,2500);
}
function spawnTruckCustomer(){
    truckCustomerTimer=null;
    ensureTruckData();

    const truck=state.trucks[currentTruckIndex];

    if(!truck?.unlocked){
        truckCustomerTimer=setTimeout(spawnTruckCustomer,3000);
        return;
    }

    if(truckCustomerBusy){
        truckCustomerTimer=setTimeout(spawnTruckCustomer,3000);
        return;
    }

    const area=document.getElementById("customerArea");

    if(!area)return;

    truckCustomerBusy=true;

    /* 隨機選擇顧客 */
    const character=
        CHARACTERS[
            Math.floor(
                Math.random()*CHARACTERS.length
            )
        ];

    /* 從 8 種料理隨機選擇一種 */
    const recipe=
        RECIPES[
            Math.floor(
                Math.random()*RECIPES.length
            )
        ];

    const customer=document.createElement("div");

    customer.className="truck-customer";

    customer.style.left=
        `${25+Math.random()*50}%`;

    customer.innerHTML=`
        <img src="${characterImage(character)}">
        <div class="truck-customer-bubble">
            ${recipe.icon}
        </div>
    `;

    area.appendChild(customer);

    requestAnimationFrame(()=>{
        customer.classList.add("walk-in");
    });

    setTimeout(()=>{
        if(customer.isConnected){
            customer.classList.add("walk-out");
        }
    },6500);

    setTimeout(()=>{
        if(customer.isConnected){
            customer.remove();
        }

        truckCustomerBusy=false;

        truckCustomerTimer=
            setTimeout(
                spawnTruckCustomer,
                2500
            );

    },12000);
}

function renderCustomer(){
    renderTruckCustomerLoop();
}

/* =========================================================
   匯出存檔
========================================================= */

async function exportSave(){

    try{

        await save();


        const data =
            structuredClone
                ? structuredClone(state)
                : JSON.parse(
                    JSON.stringify(state)
                );


        const exportData = {

            game:"secretGardenTruck",

            version:1,

            exportedAt:
                new Date().toISOString(),

            state:data

        };


        const json =
            JSON.stringify(
                exportData,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        const date =
            new Date()
                .toISOString()
                .slice(0,10);


        link.href=url;

        link.download=
            `秘密花園存檔_${date}.json`;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        toast(
            "📤 存檔匯出成功"
        );


    }catch(error){

        console.error(
            error
        );

        toast(
            "❌ 存檔匯出失敗"
        );

    }

}

/* =========================================================
   匯入存檔
========================================================= */

async function importSaveFile(event){

    const file =
        event.target.files?.[0];


    if(!file){

        return;

    }


    try{

        const text =
            await file.text();


        const imported =
            JSON.parse(
                text
            );


        /*
           檢查存檔格式。
        */

        if(
            !imported ||
            imported.game !==
                "secretGardenTruck" ||
            !imported.state
        ){

            throw new Error(
                "不是有效的秘密花園存檔"
            );

        }


        /*
           合併到目前版本，
           避免未來新增欄位後造成錯誤。
        */

        const newState =
            mergeState(
                imported.state
            );


        /*
           先寫入 IndexedDB。
        */

        await writeIndexedDB(
            newState
        );


        /*
           更新目前遊戲狀態。
        */

        state =
            newState;


        closeModal();


        /*
           重新渲染所有目前畫面。
        */

        renderGarden();

        renderKitchen();

        renderTruck();


        toast(
            "📥 存檔匯入成功"
        );


    }catch(error){

        console.error(
            "匯入存檔失敗",
            error
        );


        toast(
            "❌ 存檔格式錯誤，無法匯入"
        );

    }

}

/* =========================================================
   全域更新
========================================================= */
function gameTick(){
processHelperJobs();

const now=Date.now();

let cookingChanged=false;

for(const line of state.cooking){
if(line&&line.recipeId&&line.endTime&&line.endTime<=now&&!line._doneNotified){
line._doneNotified=true;
cookingChanged=true;
}
}

if(state.expedition.active&&now>=state.expedition.endTime){
const status=document.getElementById("dispatchStatus");
if(status)status.textContent="可以領取";
}

processTruckSales();

if(cookingChanged)save();

const kitchen=document.getElementById("kitchenPage")?.classList.contains("active");
const truck=document.getElementById("truckPage")?.classList.contains("active");

if(kitchen){
renderCookingLines();
renderCookingHelper();
}

if(truck){
updateTruckDisplay();
renderCustomer();
}
}


/* =========================================================
   初始化
========================================================= */

async function init(){

    state=await loadState();
ensureTruckData();
if(!Array.isArray(state.joined))state.joined=[];
if(!Array.isArray(state.cooking))state.cooking=[];
while(state.cooking.length<state.cookingLines){
state.cooking.push({recipeId:null,endTime:0,helperEnabled:false});
}
saveReady=true;
await save();
renderGarden();
setInterval(gameTick,1000);

}


init();


/* =========================================================
   防止手機長按選取／拖曳圖片
========================================================= */

document.addEventListener(
    "dragstart",
    event=>{

        if(
            event.target.tagName===
            "IMG"
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   防止部分手機瀏覽器雙擊放大
========================================================= */

let lastTouchEnd=0;

document.addEventListener(
    "touchend",
    event=>{

        const now =
            Date.now();


        if(
            now-lastTouchEnd<=300
        ){

            event.preventDefault();

        }


        lastTouchEnd=now;

    },
    {
        passive:false
    }
);


/* =========================================================
   防止頁面橡皮筋效果
========================================================= */

document.addEventListener(
    "touchmove",
    event=>{

        const page =
            event.target.closest(
                ".page"
            );


        if(!page){

            return;

        }

    },
    {
        passive:true
    }
);

function updateToLatest(){
    if(!confirm("將重新載入最新版本，遊戲存檔不會被刪除。")){
        return;
    }

    const url=
        window.location.pathname+
        "?v="+Date.now();

    window.location.replace(url);
}
